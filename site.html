<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>طلای مهدی (عج)</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#020508;min-height:100%}
#site{display:block;width:100%;border:0;background:#020508;overflow:hidden}
</style>
</head>
<body>
<iframe id="site" src="mahdi-gold-groups-fixed(6).html" title="سایت طلای مهدی (عج)"></iframe>
<script>
(function(){
  const SITE_URL='https://goldmahdi77.github.io/mahdi-gold-groups/';
  const frame=document.getElementById('site');
  function txt(el){return (el?.textContent||'').replace(/\s+/g,' ').trim();}
  function findText(doc, words){
    for(const el of doc.querySelectorAll('button,a,[role="button"],div,span,p,h1,h2,h3,h4,h5')){
      const t=txt(el);
      if(t && t.length<100 && words.some(w=>t.includes(w))) return el;
    }
    return null;
  }
  function edit(doc){
    if(!doc) return;

    // فقط کادر QR پایین صفحه را حذف کن.
    const title=findText(doc,['QR کد دقیق سایت']);
    if(title){
      let box=title;
      for(let i=0;i<10 && box.parentElement;i++){
        box=box.parentElement;
        const t=txt(box);
        if(t.includes('QR کد دقیق سایت') && (box.querySelector('canvas,img,svg') || getComputedStyle(box).borderWidth!=='0px' || getComputedStyle(box).padding!=='0px')){
          box.style.display='none';
          break;
        }
      }
    }

    // دکمه دانلود QR حذف شود؛ دو دکمه کپی لینک و اشتراک‌گذاری باقی بمانند.
    const dl=findText(doc,['دانلود QR Code','دانلود QR code','دانلود QR']);
    if(dl){
      let b=dl;
      for(let i=0;i<5 && b.parentElement;i++){
        if(b.tagName==='BUTTON'||b.tagName==='A'||b.getAttribute('role')==='button') { b.style.display='none'; break; }
        const p=b.parentElement;
        if(p.querySelectorAll('button,a,[role="button"]').length>=2){ b.style.display='none'; break; }
        b=p;
      }
    }

    const copy=findText(doc,['کپی لینک']);
    if(copy){
      copy.onclick=async e=>{
        e.preventDefault();
        try{await navigator.clipboard.writeText(SITE_URL);}catch(_){
          const ta=doc.createElement('textarea');ta.value=SITE_URL;doc.body.appendChild(ta);ta.select();doc.execCommand('copy');ta.remove();
        }
      };
    }

    const share=findText(doc,['اشتراک گذاری','اشتراک‌گذاری']);
    if(share){
      share.onclick=async e=>{
        e.preventDefault();
        if(navigator.share){try{await navigator.share({title:'طلای مهدی (عج)',url:SITE_URL});}catch(_){} }
        else {try{await navigator.clipboard.writeText(SITE_URL);}catch(_){} }
      };
    }

    frame.style.height=Math.max(doc.documentElement.scrollHeight,doc.body.scrollHeight)+'px';
  }
  frame.addEventListener('load',()=>{
    try{
      const doc=frame.contentDocument;
      edit(doc);
      setTimeout(()=>edit(doc),300);
      setTimeout(()=>edit(doc),1000);
      setTimeout(()=>edit(doc),2000);
    }catch(e){frame.style.height='min(94vh,980px)';}
  });
})();
</script>
</body>
</html>
