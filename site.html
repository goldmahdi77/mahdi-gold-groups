<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>طلای مهدی (عج)</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#020508;min-height:100%}
#site{display:block;width:100%;border:0;background:#020508;overflow:hidden}
</style>
</head>
<body>
<iframe id="site" src="mahdi-gold-groups-fixed(6).html" title="سایت طلای مهدی (عج)"></iframe>
<script>
(function(){
  const frame=document.getElementById('site');
  frame.addEventListener('load',function(){
    try{
      const doc=frame.contentDocument;
      const style=doc.createElement('style');
      style.textContent='.qr-card{display:none!important}';
      doc.head.appendChild(style);
      const resize=()=>{
        frame.style.height=Math.max(doc.documentElement.scrollHeight,doc.body.scrollHeight)+'px';
      };
      resize();
      setTimeout(resize,100);
      setTimeout(resize,500);
    }catch(e){
      frame.style.height='min(94vh,980px)';
    }
  });
})();
</script>
</body>
</html>
