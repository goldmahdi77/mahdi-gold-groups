<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#061018">
  <meta name="description" content="گالری طلای مهدی — درخشش اصالت، ماندگار برای همیشه">
  <title>طلای مهدی | گالری طلای مهدی</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap');

:root {
  --bg: #03090e;
  --gold: #dcae45;
  --whatsapp: #25d366;
  --eitaa-a: #ff6a00;
  --eitaa-b: #ffffff;
  --shadow: 0 18px 45px rgba(0,0,0,.48);
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); }
body { font-family: Vazirmatn, Tahoma, Arial, sans-serif; }

.page {
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 18px;
  background:
    radial-gradient(circle at 50% 10%, rgba(224,173,65,.08), transparent 32%),
    #03090e;
}

.poster {
  position: relative;
  width: min(100%, 620px);
  aspect-ratio: 2 / 3;
  overflow: hidden;
  border-radius: 3px;
  box-shadow: 0 30px 90px rgba(0,0,0,.62);
  isolation: isolate;
}

.poster-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  z-index: -2;
}

.poster::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: -1;
  background: linear-gradient(180deg, rgba(2,7,12,.03), rgba(2,7,12,.10));
}

.links {
  position: absolute;
  inset: 0;
  z-index: 3;
}

.link-card {
  position: absolute;
  left: 20.5%;
  width: 59%;
  height: 9.15%;
  display: flex;
  align-items: center;
  direction: rtl;
  text-decoration: none;
  border-radius: 26px;
  border: 2px solid currentColor;
  background: rgba(3, 10, 15, .91);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.05), 0 8px 22px rgba(0,0,0,.34);
  transition: transform .22s cubic-bezier(.2,.75,.25,1), box-shadow .22s ease, background .22s ease, filter .22s ease;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

.link-card::before {
  content: "";
  position: absolute;
  inset: 2px;
  border-radius: 23px;
  pointer-events: none;
  opacity: .55;
}

.link-card:hover,
.link-card:focus-visible {
  transform: translateY(-4px) scale(1.018);
  box-shadow: 0 14px 32px rgba(0,0,0,.58), 0 0 24px currentColor;
  filter: saturate(1.08) brightness(1.08);
  outline: none;
}

.link-card:active { transform: translateY(-1px) scale(.995); }

.whatsapp { top: 49.6%; color: var(--whatsapp); }
.eitaa { top: 59.75%; color: var(--eitaa-a); }
.rubika { top: 69.95%; color: #ff2d55; }

.eitaa::before {
  background: linear-gradient(90deg, rgba(255,106,0,.26), rgba(255,255,255,.11), rgba(255,106,0,.26));
}
.whatsapp::before { background: linear-gradient(90deg, rgba(37,211,102,.24), rgba(37,211,102,.04), rgba(37,211,102,.24)); }
.rubika::before { background: linear-gradient(90deg, rgba(255,45,85,.16), rgba(10,132,255,.08), rgba(175,82,222,.16)); }

.link-icon {
  position: relative;
  flex: 0 0 17%;
  width: 17%;
  height: 100%;
  display: grid;
  place-items: center;
  margin-right: 2%;
  z-index: 1;
}
.link-icon svg { width: 57%; height: 57%; display: block; }
.whatsapp-icon { color: var(--whatsapp); }
.eitaa-icon { color: white; }
.eitaa-icon span {
  width: 54%; aspect-ratio: 1;
  display: grid; place-items: center;
  border-radius: 24% 52% 52% 52%;
  background: linear-gradient(135deg, #ff6a00 5%, #ff9d2e 48%, #fff 100%);
  color: #081018;
  font: 700 clamp(18px, 4vw, 30px)/1 Arial, sans-serif;
  transform: rotate(-7deg);
  box-shadow: 0 0 16px rgba(255,106,0,.35);
}
.rubika-icon { color: white; }

.label {
  font-size: clamp(12px, 3.2vw, 19px);
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
  position: relative;
  z-index: 1;
  flex: 1;
  text-align: center;
  font-size: clamp(17px, 3.2vw, 25px);
  font-weight: 500;
  letter-spacing: -.2px;
  color: #fff;
  text-shadow: 0 2px 12px rgba(0,0,0,.8);
}

.arrow {
  position: relative;
  z-index: 1;
  flex: 0 0 10%;
  color: currentColor;
  font: 400 clamp(28px, 5vw, 38px)/1 Arial, sans-serif;
  transform: translateY(-1px);
  text-align: center;
}

@media (max-width: 520px) {
  .page { padding: 0; }
  .poster { width: 100vw; border-radius: 0; }
  .link-card { border-width: 1.5px; border-radius: 21px; }
  .link-card::before { border-radius: 19px; }
  .link-card:hover, .link-card:focus-visible { transform: translateY(-2px) scale(1.01); }
}

@media (prefers-reduced-motion: reduce) {
  .link-card { transition: none; }
}

</style>
</head>
