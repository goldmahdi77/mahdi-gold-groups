<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Code | طلای مهدی</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(145deg,#d9f1ff,#fff,#c8edff);color:#173259}.card{width:min(94vw,520px);text-align:center;background:#fff;border:2px solid #dfb342;border-radius:28px;padding:28px 20px;box-shadow:0 18px 50px #005d912e}.title{font-size:28px;font-weight:900;color:#0878c0}.sub{color:#666;margin:8px 0 20px}.qr{width:260px;height:260px;margin:auto;padding:15px;background:#fff;border:2px solid #dfb342;border-radius:22px;display:grid;place-items:center}.qr canvas,.qr img{max-width:230px;max-height:230px}.url{direction:ltr;word-break:break-all;font-size:12px;color:#666;margin:16px auto;max-width:450px}.btn{display:inline-block;border:0;border-radius:14px;padding:13px 22px;background:#0878c0;color:#fff;text-decoration:none;font-weight:bold;cursor:pointer;margin:5px}.btn.alt{background:#d29c25}
</style>
</head>
<body>
<main class="card">
<div class="title">طلای مهدی | QR Code</div>
<div class="sub">این کد را اسکن کنید تا مستقیماً وارد صفحه گروه‌های رسمی شوید.</div>
<div class="qr"><div id="qrcode"></div></div>
<div class="url" id="url"></div>
<button class="btn" id="download">دانلود QR Code</button>
<a class="btn alt" href="./index.html">بازگشت به صفحه</a>
</main>
<script>
const target='https://goldmahdi77.github.io/mahdi-gold-groups/';
document.getElementById('url').textContent=target;
new QRCode(document.getElementById('qrcode'),{text:target,width:230,height:230,colorDark:'#0878c0',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});
document.getElementById('download').addEventListener('click',()=>{const c=document.querySelector('#qrcode canvas');const img=document.querySelector('#qrcode img');const a=document.createElement('a');a.download='mahdi-gold-groups-qr.png';a.href=c?c.toDataURL('image/png'):img.src;a.click()});
</script>
</body>
</html>
