<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>طلای مهدی | گروه‌های رسمی</title>
<meta name="description" content="صفحه رسمی گروه‌های طلای مهدی">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#090806}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="site" src="index%20(3).html" title="طلای مهدی"></iframe>
<script>
(function(){
  const pageURL = "https://goldmahdi77.github.io/mahdi-gold-groups/";
  const frame = document.getElementById("site");

  function fixPage(){
    try{
      const w = frame.contentWindow;
      const d = frame.contentDocument;
      if(!w || !d) return;

      function toast(msg){
        if(typeof w.showQRToast === "function") w.showQRToast(msg);
      }

      function render(){
        const target = d.getElementById("qrcode");
        if(!target || typeof w.QRCode === "undefined") return false;
        target.innerHTML = "";
        new w.QRCode(target,{
          text:pageURL,width:190,height:190,
          colorDark:"#111111",colorLight:"#ffffff",
          correctLevel:w.QRCode.CorrectLevel.H
        });
        return true;
      }

      w.copyPageLink = async function(){
        try{
          if(navigator.clipboard && window.isSecureContext){
            await navigator.clipboard.writeText(pageURL);
          }else{
            const temp=d.createElement("textarea");
            temp.value=pageURL;
            temp.setAttribute("readonly","");
            temp.style.position="fixed";
            temp.style.opacity="0";
            d.body.appendChild(temp);
            temp.select();
            d.execCommand("copy");
            temp.remove();
          }
          toast("لینک صفحه کپی شد ✓");
        }catch(e){ toast("کپی لینک انجام نشد"); }
      };

      w.sharePage = async function(){
        try{
          if(navigator.share){
            await navigator.share({
              title:"طلای مهدی",
              text:"صفحه گروه‌های طلای مهدی",
              url:pageURL
            });
          }else{
            await w.copyPageLink();
            toast("لینک کپی شد؛ می‌توانید آن را ارسال کنید.");
          }
        }catch(e){
          if(!e || e.name!=="AbortError") toast("اشتراک‌گذاری در این دستگاه در دسترس نیست");
        }
      };

      if(!render()) setTimeout(render,300);
    }catch(e){}
  }

  frame.addEventListener("load",fixPage);
  window.addEventListener("resize",fixPage);
})();
</script>
</body>
</html>
