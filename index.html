<script>
const pageUrl='https://goldmahdi77.github.io/mahdi-gold-groups/';
new QRCode(document.getElementById('qrcode'),{text:pageUrl,width:205,height:205,colorDark:'#111',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.H});
function toast(t){const e=document.getElementById('toast');e.textContent=t;setTimeout(()=>e.textContent='',2200)}
function copyLink(){navigator.clipboard?.writeText(pageUrl).then(()=>toast('لینک کپی شد ✓')).catch(()=>toast(pageUrl))}
async function sharePage(){if(navigator.share){try{await navigator.share({title:'طلای مهدی',url:pageUrl})}catch(e){}}else copyLink()}
function downloadQR(){const c=document.querySelector('#qrcode canvas');if(!c){toast('QR هنوز آماده نشده');return}const a=document.createElement('a');a.download='mahdi-gold-qr.png';a.href=c.toDataURL('image/png');a.click();toast('QR Code دانلود شد ✓')}
